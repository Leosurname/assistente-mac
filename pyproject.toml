[project]
name = "assistente-mac-backend"
version = "0.1.0"
description = "Backend do Assistente Mac: conversa com a Layla e traduz pedidos em acoes"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
addopts = "-q"
